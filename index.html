<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modulr Studio - Architecture Refined</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Instant splash, inline so it renders before ANY JavaScript or external
       CSS arrives. Tailwind is now compiled at build time (it used to be the
       cdn.tailwindcss.com runtime compiler, which left the page blank white
       for 10-20s on slow connections) and React is bundled (it used to load
       from esm.sh at runtime via an importmap). index.tsx removes the splash
       once React has mounted. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #405a56;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
      transition: opacity .4s ease;
      font-family: 'Montserrat', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #splash .brand {
      color: #fff;
      letter-spacing: .35em;
      font-size: 15px;
      font-weight: 600;
      text-transform: uppercase;
    }

    #splash .brand span {
      font-weight: 300;
      opacity: .7;
    }

    #splash .ring {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, .25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: splash-spin .8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Logo.png already carries the Modulr Studio wordmark, so the splash
       shows just it and the spinner - the old text line underneath doubled
       the brand name on every load. -->
  <div id="splash" aria-hidden="true">
    <img src="/Logo.png" alt="" style="width:220px;height:auto;object-fit:contain;" />
    <div class="ring"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
